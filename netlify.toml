# Netlify deploy config for this TanStack Start (SSR) app.
# Nitro's `netlify` preset writes the static assets to `dist/` (incl. its own
# `_headers`/`_redirects`) and the SSR handler to
# `.netlify/functions-internal/server`, which Netlify picks up automatically.
# The preset is pinned in vite.config.ts.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 / Nitro 3 need a modern Node.
  NODE_VERSION = "22"
